<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Map Fountain current architecture</title>
  <desc id="desc">Raster MBTiles on a Windows PC or SSD are served through local HTTPS WMTS over a private USB tether to ArcGIS Earth Mobile.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4b5563"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1200" height="390" rx="22" fill="#f6f8fb"/>
  <text x="600" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#17233a">Map Fountain</text>
  <text x="600" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#5f6b7a">MBTiles → local HTTPS WMTS → private USB tether → ArcGIS Earth Mobile</text>

  <g filter="url(#shadow)">
    <rect x="55" y="130" width="225" height="132" rx="18" fill="#fff" stroke="#d39c12" stroke-width="3"/>
    <rect x="82" y="155" width="54" height="54" rx="8" fill="#d39c12"/>
    <path d="M94 169h30M94 181h30M94 193h30" stroke="#fff" stroke-width="4"/>
    <text x="190" y="166" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#17233a">MBTiles</text>
    <text x="168" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#5f6b7a">PC / SSD mother map</text>
    <text x="168" y="222" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5f6b7a">PNG / JPEG raster pyramid</text>
    <text x="168" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#176b3a">read only</text>
  </g>

  <line x1="280" y1="196" x2="345" y2="196" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="360" y="116" width="285" height="160" rx="18" fill="#fff" stroke="#1756a9" stroke-width="3"/>
    <circle cx="405" cy="158" r="25" fill="#1756a9"/>
    <text x="405" y="166" text-anchor="middle" font-family="Consolas,monospace" font-size="19" font-weight="700" fill="#fff">Py</text>
    <text x="510" y="156" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#17233a">Map Fountain</text>
    <text x="502" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#5f6b7a">TMS row flip • WMTS capabilities</text>
    <text x="502" y="214" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#5f6b7a">unique per-map service ID</text>
    <text x="502" y="238" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#5f6b7a">HTTPS • QR • live tile requests</text>
    <text x="502" y="260" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#176b3a">no public Internet required</text>
  </g>

  <line x1="645" y1="196" x2="710" y2="196" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="725" y="130" width="180" height="132" rx="18" fill="#fff" stroke="#6b5bd2" stroke-width="3"/>
    <path d="M765 174h95" stroke="#6b5bd2" stroke-width="8" stroke-linecap="round"/>
    <path d="M777 154v40M800 154v40M823 154v40M846 154v40" stroke="#6b5bd2" stroke-width="3"/>
    <text x="815" y="220" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#17233a">USB tether</text>
    <text x="815" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5f6b7a">Remote NDIS private link</text>
  </g>

  <line x1="905" y1="196" x2="960" y2="196" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="975" y="116" width="175" height="160" rx="18" fill="#fff" stroke="#1678c8" stroke-width="3"/>
    <rect x="1023" y="139" width="78" height="112" rx="13" fill="#e9f4fc" stroke="#1678c8" stroke-width="3"/>
    <circle cx="1062" cy="230" r="5" fill="#1678c8"/>
    <text x="1062" y="170" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17233a">ArcGIS</text>
    <text x="1062" y="191" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17233a">Earth Mobile</text>
    <text x="1062" y="263" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#5f6b7a">requests only needed tiles</text>
  </g>

  <rect x="270" y="323" width="660" height="42" rx="21" fill="#17233a"/>
  <text x="600" y="350" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">CHOOSE MAP • START FOUNTAIN • SCAN QR • FLY STEADILY</text>
</svg>
