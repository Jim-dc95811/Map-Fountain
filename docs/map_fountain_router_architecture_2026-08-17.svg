<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <title>ArcGIS Earth Systems Offline Field Mapping — Router-Based Map Fountain Architecture</title>
  <desc>Router-only Map Fountain architecture: USB SSD attached to a GL.iNet Flint 2 shares TPKX and MBTiles over Wi-Fi or Ethernet to ArcGIS Earth clients.</desc>
  <rect width="1536" height="1024" fill="#ffffff"/>
  <style>
    .h1{font:700 40px Arial,sans-serif;fill:#123b7a}.h2{font:700 28px Arial,sans-serif;fill:#1565c0}.head{font:700 23px Arial,sans-serif;fill:#123b7a}.green{fill:#246b21}.orange{fill:#ef5b00}.body{font:18px Arial,sans-serif;fill:#111}.small{font:16px Arial,sans-serif;fill:#111}.blue{stroke:#145ba7;stroke-width:7;fill:none;stroke-linecap:round}.thin{stroke:#145ba7;stroke-width:3;fill:none}.box{fill:#fff;stroke:#1768d1;stroke-width:2}.obox{fill:#fff;stroke:#ef5b00;stroke-width:2}.center{fill:#fff;stroke:#145ba7;stroke-width:8}.label{font:700 19px Arial,sans-serif;fill:#111}.foot{font:700 17px Arial,sans-serif;fill:#111}
  </style>
  <text x="768" y="57" text-anchor="middle" class="h1">ARCGIS EARTH SYSTEMS OFFLINE FIELD MAPPING</text>
  <text x="768" y="96" text-anchor="middle" class="h2">Router-Based Map Fountain Architecture</text>

  <!-- spokes -->
  <path d="M610 407 L430 285" class="blue"/><path d="M725 330 L725 262" class="blue"/><path d="M900 392 L1038 290" class="blue"/>
  <path d="M575 505 L350 505" class="blue"/><path d="M590 595 L382 725" class="blue"/><path d="M730 680 L730 745" class="blue"/>
  <path d="M905 596 L1020 685" class="blue"/><path d="M912 505 L1040 505" class="blue"/>

  <!-- center -->
  <circle cx="735" cy="505" r="180" class="center"/><circle cx="735" cy="505" r="168" fill="none" stroke="#2f8c3a" stroke-width="2"/>
  <rect x="650" y="398" width="145" height="93" rx="5" fill="#18212c"/><rect x="662" y="410" width="121" height="69" rx="3" fill="#2b78a8"/>
  <circle cx="722" cy="444" r="26" fill="#4c9bd5"/><path d="M692 444 q30 -35 60 0 q-30 35 -60 0" fill="#2f6c3a"/>
  <rect x="705" y="491" width="36" height="12" fill="#18212c"/><rect x="680" y="503" width="85" height="8" rx="3" fill="#18212c"/>
  <rect x="803" y="420" width="48" height="92" rx="8" fill="#263543"/><rect x="809" y="429" width="36" height="63" rx="3" fill="#3c8bbd"/><circle cx="827" cy="501" r="4" fill="#bbb"/>
  <text x="735" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#123b7a">ArcGIS Earth</text>
  <text x="735" y="594" text-anchor="middle" class="label">PC &amp; Mobile</text>
  <text x="735" y="625" text-anchor="middle" class="body">View • Navigate • Analyze</text><text x="735" y="649" text-anchor="middle" class="body">Offline / Online</text>

  <!-- factory -->
  <text x="150" y="160" class="head">TPKX FACTORY (PC)</text><text x="150" y="187" class="body">Build TPKX from map sources</text><text x="150" y="211" class="body">and large images</text>
  <rect x="140" y="228" width="292" height="142" rx="14" class="box"/>
  <circle cx="205" cy="277" r="34" fill="none" stroke="#123b7a" stroke-width="9"/><circle cx="205" cy="277" r="14" fill="none" stroke="#123b7a" stroke-width="5"/>
  <path d="M257 277 h58" stroke="#1768d1" stroke-width="4"/><path d="M308 268 l12 9 -12 9" fill="none" stroke="#1768d1" stroke-width="4"/>
  <path d="M355 247 l38 24 -38 24 -38 -24z M355 266 l38 24 -38 24 -38 -24z M355 285 l38 24 -38 24 -38 -24z" fill="none" stroke="#123b7a" stroke-width="4"/>
  <text x="205" y="332" text-anchor="middle" class="label">QGIS +</text><text x="205" y="354" text-anchor="middle" class="label">Python</text>
  <text x="355" y="332" text-anchor="middle" class="label">TPKX</text><text x="355" y="354" text-anchor="middle" class="label">Output</text>

  <!-- gps -->
  <text x="725" y="140" text-anchor="middle" class="head green">GPS DEVICES</text><text x="725" y="168" text-anchor="middle" class="body">NMEA via Built-in</text><text x="725" y="192" text-anchor="middle" class="body">or PRAVE/ME Bridge</text>
  <ellipse cx="685" cy="230" rx="35" ry="13" fill="#263543"/><rect x="677" y="239" width="16" height="30" rx="5" fill="#263543"/>
  <rect x="755" y="215" width="31" height="53" rx="7" fill="#263543"/><rect x="761" y="221" width="19" height="18" fill="#d9edf4"/><circle cx="765" cy="249" r="3" fill="#ccc"/><circle cx="775" cy="249" r="3" fill="#ccc"/>

  <!-- high res -->
  <text x="1068" y="155" class="head">HIGH-RES IMAGE PYRAMID</text><text x="1105" y="184" class="body">Convert large images to</text><text x="1138" y="208" class="body">TPKX / MBTiles</text>
  <path d="M1030 242 l85 -48 85 48 -85 48z" fill="#76a7cf" stroke="#345"/><path d="M1030 262 l85 -48 85 48 -85 48z" fill="#366e93" stroke="#345" opacity=".9"/><path d="M1030 282 l85 -48 85 48 -85 48z" fill="#184a71" stroke="#345" opacity=".9"/>

  <!-- stored -->
  <text x="110" y="440" class="head green">STORED TPKX / MBTILES</text><text x="145" y="468" class="body">Local or Network Storage</text>
  <ellipse cx="205" cy="500" rx="30" ry="11" fill="#263543"/><rect x="175" y="500" width="60" height="49" fill="#263543"/><ellipse cx="205" cy="549" rx="30" ry="11" fill="#263543"/>
  <path d="M270 488 h40 l20 20 v53 h-60z" fill="#fff" stroke="#222" stroke-width="4"/><path d="M310 488 v20 h20" fill="none" stroke="#222" stroke-width="4"/>
  <text x="250" y="588" text-anchor="middle" class="label">TPKX / MBTiles</text>

  <!-- chart -->
  <text x="145" y="665" class="head">CHART PLOTTER (PC)</text><text x="168" y="692" class="body">ArcGIS Earth PC is</text><text x="170" y="716" class="body">the new chart plotter</text>
  <rect x="160" y="735" width="210" height="118" rx="5" fill="#263543"/><rect x="171" y="745" width="188" height="92" fill="#d8edf5"/><path d="M180 817 q45 -25 88 -4 t85 -22" fill="none" stroke="#b34" stroke-width="3"/><path d="M264 853 v20 M220 873 h88" stroke="#263543" stroke-width="8"/>

  <!-- qr -->
  <text x="730" y="742" text-anchor="middle" class="head green">QR CODE READER</text><text x="730" y="769" text-anchor="middle" class="body">Dispatch / Data Ingest</text><text x="730" y="793" text-anchor="middle" class="body">Commands / Data</text>
  <rect x="686" y="808" width="84" height="84" rx="10" fill="#fff" stroke="#2f8c3a" stroke-width="3"/><path d="M699 820 h22 v22 h-22z M735 820 h22 v22 h-22z M699 856 h22 v22 h-22z" fill="none" stroke="#111" stroke-width="5"/><path d="M735 852 h8 v8 h-8z M751 852 h8 v8 h-8z M743 868 h16 v8 h-16z" fill="#111"/>

  <!-- panorama -->
  <text x="1038" y="724" class="head">CITYSCAPE / PANORAMA SCENES</text><text x="1090" y="752" class="body">Large panoramic images</text><text x="1090" y="776" class="body">Converted to TPKX / MBTiles</text>
  <rect x="1000" y="793" width="380" height="95" rx="10" fill="#d9eef8" stroke="#123b7a" stroke-width="2"/><path d="M1010 865 h360" stroke="#4c6" stroke-width="4"/><path d="M1030 858 v-30 h18 v30 M1054 858 v-45 h22 v45 M1085 858 v-34 h20 v34 M1110 858 v-55 h28 v55 M1145 858 v-40 h18 v40 M1168 858 v-63 h28 v63 M1203 858 v-46 h20 v46 M1230 858 v-58 h28 v58 M1265 858 v-39 h19 v39 M1290 858 v-50 h24 v50 M1320 858 v-32 h20 v32" fill="#5b7185" stroke="#40556b"/>

  <!-- router only -->
  <text x="1065" y="375" class="head orange">MAP FOUNTAIN — ROUTER</text><text x="1065" y="403" class="body">USB SSD on router running Samba</text><text x="1065" y="427" class="body">Shares TPKX / MBTiles over Wi-Fi or Ethernet</text>
  <rect x="1040" y="442" width="420" height="225" rx="18" class="obox"/>
  <path d="M1085 503 q-28 26 0 52 M1100 493 q-45 37 0 75 M1116 485 q-61 48 0 94" fill="none" stroke="#ef5b00" stroke-width="8"/>
  <rect x="1150" y="505" width="170" height="52" rx="19" fill="#23272b"/><line x1="1172" y1="505" x2="1172" y2="464" stroke="#23272b" stroke-width="7"/><line x1="1295" y1="505" x2="1295" y2="464" stroke="#23272b" stroke-width="7"/>
  <text x="1235" y="584" text-anchor="middle" class="label">GL.iNet Flint 2</text>
  <path d="M1325 525 h38" class="thin"/><path d="M1358 519 l10 6 -10 6" fill="none" stroke="#145ba7" stroke-width="3"/>
  <rect x="1370" y="494" width="55" height="90" rx="8" transform="rotate(55 1397 539)" fill="#20252a"/>
  <text x="1395" y="584" text-anchor="middle" class="label">USB SSD</text><text x="1395" y="607" text-anchor="middle" class="small">TPKX / MBTiles</text>
  <text x="1250" y="633" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ef5b00">No GIS server. No extra software.</text><text x="1250" y="654" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ef5b00">Just storage and sharing.</text>

  <!-- footer -->
  <rect x="140" y="910" width="1250" height="92" rx="14" class="box"/>
  <text x="170" y="944" class="head">THE MAP FOUNTAIN CONCEPT</text><text x="170" y="971" class="small">Base laptop/SSD holds master maps. Share via router over Wi-Fi or Ethernet.</text><text x="170" y="992" class="small">Devices connect and consume maps offline. Simple. Rugged. Effective.</text>
  <text x="770" y="946" class="foot" fill="#197b2b">✓</text><text x="800" y="946" class="small">All maps remain in native TPKX / MBTiles format</text>
  <text x="770" y="972" class="foot" fill="#197b2b">✓</text><text x="800" y="972" class="small">Works Offline — no Internet required</text>
  <text x="770" y="996" class="foot" fill="#197b2b">✓</text><text x="800" y="996" class="small">Scalable from one device to many</text>
  <text x="1210" y="948" text-anchor="middle" class="label">Wi-Fi</text><text x="1210" y="971" text-anchor="middle" class="small">802.11ax</text><text x="1320" y="948" text-anchor="middle" class="label">Ethernet</text><text x="1320" y="971" text-anchor="middle" class="small">Optional</text>
</svg>